[project]
name = "rag-evaluation-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sumran Harchirkar", email = "sumranharchirkar58@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepeval>=4.2.8",
    "dotenv>=0.9.9",
    "langchain>=1.4.4",
    "langchain-core>=1.6.10",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag-evaluation-system = "rag_evaluation_system:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
